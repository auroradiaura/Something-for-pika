<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Happy Birthday Pika! ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Nunito:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Safe area for notch phones */
    :root { --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px); }
    /* Prevent text resize on orientation change */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* Smooth momentum scroll on iOS */
    .scrollable { -webkit-overflow-scrolling: touch; overflow-y: auto; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: #000;
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      color: #3a2e10;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
      padding-env: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #confetti-canvas {
      width: 100% !important;
      height: 100dvh !important;
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      opacity: 0; transition: opacity .6s;
    }
    #confetti-canvas.show { opacity: 1; }
    #page {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      min-height: 100vh; min-height: 100dvh; min-height: -webkit-fill-available;
      padding: clamp(20px,5vw,40px) 16px clamp(16px,4vw,32px);
    }
/* ══ SHARED RETRO CRT / ARCADE TREATMENT — used by sakura-lock, intro,
   lamp scene, and wax-seal scene. Purely presentational: no id here is
   touched by any interaction logic. ══ */
.crt-overlay {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 50;
  background:
    repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%);
  background-size: 100% 4px, 100% 100%;
  animation: crtRoll 10s linear infinite;
}
@keyframes crtRoll {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 0 400px, 0 0; }
}
/* Slow, subtle — deliberately NOT a strobe (kept well under any
   flash-rate that could bother a sensitive viewer). */
.crt-flicker { animation: crtFlicker 4.5s ease-in-out infinite; }
@keyframes crtFlicker {
  0%, 96%, 100% { opacity: 1; }
  97%           { opacity: 0.96; }
  99%           { opacity: 0.985; }
}
.pixel-font { font-family: 'Press Start 2P', monospace; font-style: normal; }

/* ══ SAKURA LOCK SCREEN ══ */
#sakura-lock {
  position: fixed; inset: 0; z-index: 9000;
  background: radial-gradient(ellipse at 50% 40%, #1a1200 0%, #0d0900 60%, #000 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transition: opacity 1.2s ease;
}
#sakura-lock.hide { opacity: 0; pointer-events: none; }

#sakura-particles {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

#sakura-content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
  width: 90%; max-width: 380px;
  margin: auto; /* keeps centering when it fits, scrolls cleanly when it doesn't */
  padding: 20px; box-sizing: border-box;
}
/* Short / landscape phones: tighten vertical rhythm so the unlock
   button and error text never need a scroll to reach. */
@media (max-height: 480px) {
  #sakura-lock-icon { font-size: clamp(32px, 9vh, 48px); margin-bottom: 4px; }
  #sakura-hint { margin-bottom: 4px; }
  #sakura-clue { margin-bottom: 10px; }
  #sakura-input { padding: 10px 16px; }
  #sakura-btn { margin-top: 8px; padding: 9px; }
  #sakura-error { margin-top: 6px; min-height: 14px; }
  #sakura-success { margin-top: 6px; }
}

#sakura-lock-icon {
  font-size: clamp(52px, 15vw, 82px);
  margin-bottom: clamp(8px,2vh,14px);
  animation: sakuraLockPulse 2s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(201,168,76,0.8));
  text-align: center; line-height: 1; display: block;
}
@keyframes sakuraLockPulse {
  0%,100% { transform: scale(1);    filter: drop-shadow(0 0 16px rgba(201,168,76,0.7)); }
  50%      { transform: scale(1.08); filter: drop-shadow(0 0 32px rgba(232,208,120,1.0)); }
}

#sakura-hint {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(10px, 3vw, 13px);
  color: rgba(240,220,140,0.75);
  letter-spacing: 1px; line-height: 1.7; margin-bottom: 10px;
  text-align: center;
  text-shadow: 0 0 12px rgba(180,145,50,0.5);
}
#sakura-clue {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(8px, 2.2vw, 10px);
  color: rgba(201,168,76,0.5);
  letter-spacing: 0.5px; line-height: 1.7;
  margin-bottom: clamp(18px,3vh,28px);
  text-align: center;
}
#sakura-input-wrap {
  width: min(300px, 80vw);
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
#sakura-input {
  width: 100%; padding: 16px 20px;
  font-size: clamp(16px, 4.5vw, 20px);
  background: rgba(30,0,18,0.85);
  border: 2px solid rgba(201,168,76,0.4);
  border-radius: 4px; color: #f0e0a0;
  text-align: center; letter-spacing: 8px; outline: none;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 20px rgba(180,145,50,0.12);
  transition: border-color .3s, box-shadow .3s;
  -webkit-appearance: none; font-family: 'Press Start 2P', monospace;
}
#sakura-input:focus {
  border-color: rgba(201,168,76,0.8);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 30px rgba(180,145,50,0.35);
}
#sakura-input::placeholder { color: rgba(201,168,76,0.3); letter-spacing: 6px; }
#sakura-btn {
  margin-top: 16px; width: 100%; padding: 14px;
  font-size: clamp(10px, 3vw, 13px);
  background: linear-gradient(135deg, #1a1200, #3a2d00);
  border: 2px solid rgba(201,168,76,0.45);
  border-radius: 4px; color: #f0e0a0;
  letter-spacing: 1px; cursor: pointer;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 20px rgba(180,145,50,0.2);
  transition: background .2s, box-shadow .12s, transform .12s;
  -webkit-appearance: none; font-family: 'Press Start 2P', monospace;
}
#sakura-btn:hover {
  background: linear-gradient(135deg, #2a2000, #5a4a00);
  box-shadow: 3px 3px 0 rgba(0,0,0,0.5), 0 0 35px rgba(201,168,76,0.45);
}
#sakura-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 rgba(0,0,0,0.5), 0 0 35px rgba(201,168,76,0.45);
}
#sakura-error {
  margin-top: 14px;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(8px, 2.4vw, 10px);
  color: #d4a030; letter-spacing: 0.5px; line-height: 1.7; min-height: 20px;
  text-shadow: 0 0 10px rgba(201,168,76,0.5);
  opacity: 0; transition: opacity .3s; text-align: center;
}
#sakura-error.show { opacity: 1; }
#sakura-success {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(12px, 3.5vw, 16px);
  color: #f0e0a0; letter-spacing: 1px;
  opacity: 0; transition: opacity .5s; text-align: center;
  text-shadow: 0 0 20px rgba(201,168,76,0.9);
  margin-top: 12px;
}
#sakura-success.show { opacity: 1; }
@keyframes sakuraShake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-6px); }
  80%    { transform: translateX(6px); }
}
.sakura-shake { animation: sakuraShake .4s ease; }

    #intro {
      position: fixed; inset: 0; z-index: 3000;
      background: radial-gradient(ellipse at 50% 40%, #2a2000 0%, #18150a 45%, #080600 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      transition: opacity 1.1s ease;
      overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #intro.hide { opacity: 0; pointer-events: none; }

    /* Luxury shimmer overlay */
    #intro::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(201,168,76,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Thin silver decorative lines */
    #intro::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(500px, 90vw); height: min(500px, 90vw);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 50%;
      box-shadow:
        0 0 0 30px rgba(201,168,76,0.04),
        0 0 0 60px rgba(201,168,76,0.03),
        0 0 0 100px rgba(201,168,76,0.02);
      pointer-events: none;
    }

    #intro-number {
      position: relative; z-index: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(4rem, 24vw, 11rem);
      font-weight: 400;
      line-height: 1;
      /* Silver shimmer gradient on text */
      background: linear-gradient(
        160deg,
        #c8a882 0%,
        #e8d5bc 20%,
        #f5ece0 40%,
        #ffffff 50%,
        #f5ece0 60%,
        #e8d5bc 80%,
        #c8a882 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      /* Glow behind the number */
      filter: drop-shadow(0 0 30px rgba(220,180,150,0.9))
              drop-shadow(0 0 60px rgba(180,160,80,0.6))
              drop-shadow(0 0 100px rgba(140,120,30,0.4));
      animation: shimmerPulse 2s ease-in-out infinite;
    }

    @keyframes shimmerPulse {
      0%, 100% {
        filter: drop-shadow(0 0 25px rgba(220,185,155,0.85))
                drop-shadow(0 0 55px rgba(185,160,80,0.55))
                drop-shadow(0 0 90px rgba(140,120,30,0.35));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(240,200,168,1.0))
                drop-shadow(0 0 80px rgba(210,185,90,0.75))
                drop-shadow(0 0 130px rgba(160,135,35,0.5));
      }
    }

    /* Shimmer sweep animation on the gradient */
    @keyframes shimmerSweep {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }

    #intro-word {
      position: relative; z-index: 1;
      font-family: 'Press Start 2P', monospace;
      font-style: normal;
      font-size: clamp(1rem, 4.6vw, 2.2rem);
      letter-spacing: clamp(1px,0.5vw,3px);
      min-height: 1.2em; text-align: center;
      padding: 0 20px; line-height: 1.5;
      /* Silver text */
      background: linear-gradient(
        135deg,
        #b09878 0%,
        #d4bfa0 25%,
        #f0e0cc 50%,
        #d4bfa0 75%,
        #b09878 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(220,185,155,0.8))
              drop-shadow(0 0 40px rgba(180,110,110,0.45));
      /* Thin silver underline */
      text-decoration: none;
    }

    /* Thin decorative silver line above/below word */
    #intro-line {
      position: relative; z-index: 1;
      width: min(280px, 60vw); height: 1px;
      background: linear-gradient(to right,
        transparent,
        rgba(210,185,158,0.3) 20%,
        rgba(240,215,190,0.8) 50%,
        rgba(210,185,158,0.3) 80%,
        transparent
      );
      margin: 2px 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #intro-line.show { opacity: 1; }

    .pulse {
      animation: luxuryPulse .7s cubic-bezier(.22,.8,.36,1) forwards;
    }
    @keyframes luxuryPulse {
      0%   { transform: scale(.08); opacity: 0; }
      50%  { transform: scale(1.08); opacity: 1; }
      75%  { transform: scale(0.97); }
      100% { transform: scale(1);    opacity: 1; }
    }

    .fadeWord { animation: luxuryFade .65s ease-out forwards; }
    @keyframes luxuryFade {
      from { opacity: 0; transform: translateY(18px) scale(.92); letter-spacing: 14px; }
      to   { opacity: 1; transform: translateY(0)    scale(1);   letter-spacing: clamp(1px,0.5vw,3px);  }
    }
    .card {
      position: relative; z-index: 10;
      background: rgba(255,253,240,0.96);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(201,168,76,0.7);
      border-radius: 28px;
      padding: clamp(22px,5vw,48px) clamp(16px,5vw,50px) clamp(22px,5vw,44px);
      width: 100%; max-width: 560px; text-align: center; overflow-y: auto; max-height: 92dvh;
      box-shadow: 0 8px 60px rgba(180,145,50,.18), 0 2px 20px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9);
      opacity: 0; transform: translateY(44px) scale(.97);
      transition: opacity 1s ease, transform 1s ease;
    }
    .card.visible { opacity: 1; transform: translateY(0) scale(1); }
    .petals-top {
      font-size: clamp(1.1rem,3.8vw,1.9rem); letter-spacing: clamp(3px,1.5vw,8px);
      margin-bottom: 10px; display: block;
      animation: petalSway 4s ease-in-out infinite alternate;
    }
    @keyframes petalSway {
      from { transform: rotate(-4deg) scale(1); }
      to   { transform: rotate(4deg) scale(1.05); }
    }
    .hb-word {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600; color: #b8860b;
      opacity: 0; transform: translateY(28px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .hb-word.show { opacity: 1; transform: translateY(0); }
    #word-happy, #word-bday { font-size: clamp(1.4rem,6.5vw,3.4rem); }
    @media (max-width: 380px) {
      #word-happy, #word-bday { font-size: clamp(1.2rem,6vw,2rem); }
      #word-to { font-size: clamp(.9rem,4vw,1.5rem); }
      #word-you { font-size: clamp(1.1rem,5vw,2rem); }
      #nameEl { font-size: clamp(1.2rem,5vw,2rem); }
      #mainCard { padding: 16px !important; }
    }
    #word-to  { font-size: clamp(1.1rem,4.5vw,2.3rem); color: #c9a84c; }
    #word-you { font-size: clamp(1.4rem,5.5vw,2.9rem); font-style: italic; }
    .name {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(1.4rem,5.5vw,2.7rem); color: #8b6914;
      margin: 4px 0 14px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .name.show { opacity: 1; transform: translateY(0); }
    .divider {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 16px;
      opacity: 0; transition: opacity .7s ease;
    }
    .divider.show { opacity: 1; }
    .divider-line { flex:1; max-width:60px; height:1.5px; background:linear-gradient(to right,transparent,#c9a84c,transparent); }
    .divider span { font-size: 1.3rem; }
    .message-box {
      background: rgba(255,253,240,.80); border: 1.5px solid rgba(201,168,76,0.4);
      border-radius: 18px;
      padding: clamp(12px,3.5vw,24px) clamp(12px,3.5vw,26px);
      margin-bottom: 16px; text-align: left; min-height: clamp(60px,12vh,90px);
      opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s .7s;
    }
    .message-box.show { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s 0s; }
    #typed-message {
      font-size: clamp(.80rem,2.5vw,1rem);
      line-height: 1.82; color: #3a2e10;
      white-space: pre-wrap; font-style: italic;
    }
    .cursor {
      display: none; width: 2px; height: 1.1em;
      background: #c9a84c; margin-left: 2px; vertical-align: text-bottom;
      animation: blink .65s step-end infinite;
    }
    .message-box.show .cursor { display: inline-block; }
    @keyframes blink { 50% { opacity: 0; } }
    .floral-bottom {
      margin-top: 16px; font-size: clamp(.95rem,3.5vw,1.5rem);
      letter-spacing: 6px; opacity: 0; transition: opacity .7s ease;
    }
    .floral-bottom.show { opacity: 1; }
    .balloon {
      position: fixed; font-size: 2rem; pointer-events: none;
      z-index: 998; animation: riseUp linear forwards;
    }
    @keyframes riseUp {
      0%  { transform: translateY(0) rotate(-8deg); opacity: 1; }
      50% { transform: translateY(-50vh) rotate(8deg); }
      100%{ transform: translateY(-105vh) rotate(-4deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- SAKURA LOCK SCREEN -->
<div id="sakura-lock" class="crt-flicker">
  <canvas id="sakura-particles"></canvas>
  <div id="sakura-content">
    <div id="sakura-lock-icon">🔐</div>
    <div id="sakura-hint">Enter the secret password</div>
    <div id="sakura-clue">Hint: The year a star was born ✦</div>
    <div id="sakura-input-wrap">
      <input id="sakura-input" type="tel" inputmode="numeric" maxlength="4" placeholder="· · · ·" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="sakura-btn">UNLOCK ✦</button>
      <div id="sakura-error">Wrong password. Try again! 🔒</div>
      <div id="sakura-success">🔓 Opening for you...</div>
    </div>
  </div>
  <div class="crt-overlay"></div>
</div>

<div id="intro" class="crt-flicker">
  <canvas id="intro-particles" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;"></canvas>
  <div id="intro-line"></div>
  <div id="intro-number">3</div>
  <div id="intro-line2" class="intro-line2" style="width:min(280px,60vw);height:1px;background:linear-gradient(to right,transparent,rgba(240,215,190,0.7) 50%,transparent);margin:2px 0;opacity:0;transition:opacity 0.4s ease;position:relative;z-index:1;"></div>
  <div id="intro-word"></div>
  <div class="crt-overlay"></div>
</div>

<canvas id="confetti-canvas"></canvas>

<div id="page">
  <div class="card" id="mainCard">
    <span class="petals-top">✦ ★ ✦</span>
    <div>
      <span class="hb-word" id="word-happy">Happy</span>&nbsp;
      <span class="hb-word" id="word-bday">Birthday,</span>
    </div>
    <div>
      <span class="hb-word" id="word-to">To</span>&nbsp;
      <span class="hb-word" id="word-you">You</span>
    </div>
    <p class="name" id="nameEl">Pika ✦</p>
    <div class="divider" id="dividerEl">
      <div class="divider-line"></div>
      <span>🌺</span>
      <div class="divider-line"></div>
    </div>
    <div class="message-box" id="msgBox">
      <span id="typed-message"></span><span class="cursor"></span>
    </div>

    <!-- Cake appears after typing finishes -->
    <div id="cakeWrap" style="
      opacity:0; transform:translateY(20px);
      transition: opacity .9s ease, transform .9s ease;
      margin-top: 8px; text-align:center;
    ">
      <canvas id="cakeCanvas" style="display:block; margin:0 auto; max-width:100%; touch-action:none;"></canvas>
    </div>

    <div class="floral-bottom" id="floralBot">✦ ★ ✦ ★ ✦</div>
  </div>
</div>

<script>
/* ══ SAKURA LOCK SCREEN ══ */
(function() {
  const sc  = document.getElementById('sakura-particles');
  const sx  = sc.getContext('2d');
  let active = true;
  function resizeSC(){ sc.width=innerWidth; sc.height=innerHeight; }
  resizeSC(); window.addEventListener('resize', resizeSC);

  // Falling sakura petals
  const petals = Array.from({length: 55}, () => ({
    x:     Math.random() * innerWidth,
    y:     Math.random() * innerHeight,
    r:     2.5 + Math.random() * 4,
    alpha: 0.2 + Math.random() * 0.6,
    vx:    (Math.random() - 0.5) * 0.8,
    vy:    0.4 + Math.random() * 1.0,
    spin:  Math.random() * Math.PI * 2,
    spinV: (Math.random() - 0.5) * 0.06,
    color: `hsl(${Math.round(42+Math.random()*18)},${Math.round(75+Math.random()*20)}%,${Math.round(68+Math.random()*22)}%)`,
  }));

  // Floating pink glow particles
  const glows = Array.from({length: 30}, () => ({
    x: Math.random(), y: Math.random(),
    r: 0.8 + Math.random() * 2.2,
    alpha: 0.15 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2,
    speed: 0.012 + Math.random() * 0.025,
    vx: (Math.random()-0.5)*0.0008, vy: (Math.random()-0.5)*0.0006,
  }));

  (function drawSakura() {
    if (!active) return;
    sx.clearRect(0, 0, sc.width, sc.height);

    // Falling petals
    petals.forEach(p => {
      p.x += p.vx + Math.sin(p.spin * 0.3) * 0.4;
      p.y += p.vy;
      p.spin += p.spinV;
      if (p.y > sc.height + 10) { p.y = -10; p.x = Math.random() * sc.width; }
      sx.save();
      sx.globalAlpha = p.alpha;
      sx.translate(p.x, p.y);
      sx.rotate(p.spin);
      // Draw petal shape
      sx.fillStyle = p.color;
      sx.shadowColor = p.color;
      sx.shadowBlur = 8;
      sx.beginPath();
      sx.ellipse(0, 0, p.r, p.r * 1.6, 0, 0, Math.PI * 2);
      sx.fill();
      sx.restore();
    });

    // Glowing dots
    glows.forEach(g => {
      g.phase += g.speed;
      g.x += g.vx; g.y += g.vy;
      if (g.x < 0) g.x = 1; if (g.x > 1) g.x = 0;
      if (g.y < 0) g.y = 1; if (g.y > 1) g.y = 0;
      const a = g.alpha * (0.3 + Math.abs(Math.sin(g.phase)) * 0.7);
      sx.save();
      sx.globalAlpha = a;
      sx.fillStyle = '#f0e0a0';
      sx.shadowColor = '#ff80ab';
      sx.shadowBlur = 10;
      sx.beginPath();
      sx.arc(g.x * sc.width, g.y * sc.height, g.r, 0, Math.PI * 2);
      sx.fill();
      sx.restore();
    });

    requestAnimationFrame(drawSakura);
  })();

  // Stop when hidden
  const obs = new MutationObserver(() => {
    if (document.getElementById('sakura-lock').classList.contains('hide')) {
      active = false;
    }
  });
  obs.observe(document.getElementById('sakura-lock'), { attributes: true });
})();

/* ══════════════════════════════════════════════
   LAMP SCENE
══════════════════════════════════════════════ */
function showLampScene(onDone) {
  const W   = window.innerWidth;
  const H   = window.innerHeight || document.documentElement.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const mob = W < 600;

  /* wrapper */
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:5500;background:#000;overflow:hidden;opacity:0;transition:opacity .8s ease;';
  wrap.classList.add('crt-flicker');
  document.body.appendChild(wrap);
  const lampCRT = document.createElement('div');
  lampCRT.className = 'crt-overlay';
  wrap.appendChild(lampCRT);

  /* canvas */
  const cv = document.createElement('canvas');
  cv.width  = W * dpr;
  cv.height = H * dpr;
  cv.style.cssText = `position:absolute;inset:0;width:${W}px;height:${H}px;pointer-events:none;`;
  wrap.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  /* stars */
  const stars = Array.from({length:70}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: .3+Math.random()*.8, a: .1+Math.random()*.4,
    sp: .008+Math.random()*.018, tw: Math.random()*Math.PI*2,
  }));

  /* ── font sizing ──
     Beam is a triangle centred on the LAMP TIP which shifts as lamp swings.
     Worst case: lamp at max swing angle (RANGE), tip shifts W*sin(RANGE) from centre.
     Text must fit inside beam width MINUS that tip shift — so text always stays lit.  */
  const LINES     = ['HAPPY BIRTHDAY', 'TO YOU', 'PIKA'];
  const CORD      = mob ? 150 : 240; // desktop: long cord = grand arc
  const RANGE     = mob ? 1.1 : 0.9; // wide sweep — near full screen
  const BEAM_HALF = mob ? W * 0.92 : W * 0.88; // near full-screen beam both platforms
  // Text fits 88% of screen — beam is full-screen wide so always lit
  const MAX_TEXT_W = W * 0.88;

  // Start larger on desktop for a grander feel
  let fs = mob ? 38 : 72;
  const _tc = document.createElement('canvas').getContext('2d');
  while (fs > 8) {
    _tc.font = `900 ${fs}px Arial Black, Arial, sans-serif`;
    if (Math.max(...LINES.map(l => _tc.measureText(l).width)) <= MAX_TEXT_W) break;
    fs -= 1;
  }

  const LH = mob ? fs * 1.38 : fs * 1.45; // more breathing room on desktop
  const TH = LINES.length * LH;
  const TY = H * 0.50 - TH / 2;  // vertically centred

  /* ── lamp state ── */
  const PIVOT_X    = W / 2;
  const PIVOT_Y    = 0;
  const SWING_SPD  = mob ? 0.012 : 0.010; // faster — readable but dynamic
  const BEAM_LEN   = H * 2;

  let lampAng = -RANGE;
  let lampDir = 1;
  let lampOn  = false;  // false = OFF (dark), true = ON (beam visible)

  /* ── switch ── */
  const sw = document.createElement('div');
  sw.style.cssText = `
    position:absolute;
    bottom:${mob ? '40px' : '55px'};
    left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    z-index:20;user-select:none;-webkit-tap-highlight-color:transparent;
  `;
  wrap.appendChild(sw);

  const lbl = document.createElement('div');
  lbl.textContent = 'ON / OFF';
  lbl.style.cssText = `
    font-family:'Press Start 2P',monospace;
    font-size:${mob?'9px':'11px'};
    color:rgba(201,168,76,0.65);letter-spacing:2px;
  `;
  sw.appendChild(lbl);

  const pill = document.createElement('div');
  pill.style.cssText = `
    width:62px;height:32px;border-radius:16px;position:relative;
    background:rgba(15,12,0,0.92);
    border:1.5px solid rgba(201,168,76,0.38);
    transition:background .35s,border-color .35s,box-shadow .35s;
  `;
  const knob = document.createElement('div');
  knob.style.cssText = `
    position:absolute;top:5px;left:5px;
    width:20px;height:20px;border-radius:50%;
    background:#2a2200;
    transition:transform .35s,background .35s,box-shadow .35s;
  `;
  pill.appendChild(knob);
  sw.appendChild(pill);

  const hint = document.createElement('div');
  hint.textContent = '— tap anywhere to continue —';
  hint.style.cssText = `
    font-family:'Press Start 2P',monospace;
    font-size:${mob?'7px':'9px'};
    color:rgba(201,168,76,0);letter-spacing:1px;line-height:1.6;
    transition:color 1.4s ease;
  `;
  sw.appendChild(hint);

  /* turn lamp ON — only ever called once */
  let switched = false;
  function turnOn(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    if (switched) return;
    switched = true;
    lampOn   = true;
    pill.style.background  = 'rgba(80,65,0,0.95)';
    pill.style.borderColor = 'rgba(201,168,76,0.9)';
    pill.style.boxShadow   = '0 0 24px rgba(201,168,76,0.6)';
    knob.style.transform   = 'translateX(30px)';
    knob.style.background  = '#c9a84c';
    knob.style.boxShadow   = '0 0 14px rgba(201,168,76,0.95)';
    setTimeout(() => hint.style.color = 'rgba(201,168,76,0.8)', 2000);
  }
  /* Use ONLY touchend on mobile, click on desktop — never both on same element */
  if (mob) {
    sw.addEventListener('touchend', turnOn, {passive:false});
  } else {
    sw.addEventListener('click', turnOn);
  }

  /* exit — tap anywhere OUTSIDE switch after lamp is on */
  let exited = false;
  function doExit(e) {
    if (!lampOn || exited) return;
    // ignore if tap was on the switch itself
    if (sw.contains(e.target)) return;
    exited = true;
    cancelAnimationFrame(raf);
    wrap.style.opacity = '0';
    const pg = document.getElementById('page');
    if (pg) pg.style.zIndex = '7000';
    setTimeout(() => { wrap.remove(); onDone(); }, 820);
  }
  wrap.addEventListener('click',    doExit);
  wrap.addEventListener('touchend', e => doExit(e), {passive:true});

  /* ── draw lamp ── */
  function drawLamp(tx, ty) {
    const lw = mob ? 30 : 62;
    const lh = mob ? 40 : 80;
    // cord
    ctx.save();
    ctx.strokeStyle = 'rgba(201,168,76,0.5)';
    ctx.lineWidth = mob ? 1.8 : 2.5;
    ctx.beginPath();
    ctx.moveTo(PIVOT_X, PIVOT_Y);
    ctx.lineTo(tx, ty - lh * 0.5);
    ctx.stroke();
    ctx.restore();
    // housing — tilts with lampAng
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(lampAng);
    const lg = ctx.createLinearGradient(-lw/2, -lh, lw/2, 0);
    lg.addColorStop(0,   '#0c0a00');
    lg.addColorStop(0.4, '#282200');
    lg.addColorStop(0.6, '#282200');
    lg.addColorStop(1,   '#0c0a00');
    ctx.fillStyle  = lg;
    ctx.shadowColor = lampOn ? '#c9a84c' : 'transparent';
    ctx.shadowBlur  = lampOn ? 24 : 0;
    ctx.beginPath();
    ctx.moveTo(-lw/2+3, -lh);
    ctx.lineTo( lw/2-3, -lh);
    ctx.lineTo( lw/2+4,  0);
    ctx.lineTo(-lw/2-4,  0);
    ctx.closePath();
    ctx.fill();
    // emitter
    const eg = ctx.createLinearGradient(-lw/2, 0, lw/2, 0);
    eg.addColorStop(0,   'rgba(201,168,76,0.1)');
    eg.addColorStop(0.5, lampOn ? 'rgba(255,242,160,0.98)' : 'rgba(40,32,0,0.55)');
    eg.addColorStop(1,   'rgba(201,168,76,0.1)');
    ctx.fillStyle = eg;
    ctx.shadowBlur = lampOn ? 20 : 0;
    ctx.beginPath();
    ctx.ellipse(0, 5, lw/2+4, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* ── render loop ── */
  let raf;
  (function loop() {
    raf = requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#010100';
    ctx.fillRect(0, 0, W, H);

    // stars
    stars.forEach(s => {
      s.tw += s.sp;
      ctx.save();
      ctx.globalAlpha = s.a * (0.15 + Math.abs(Math.sin(s.tw)) * 0.65);
      ctx.fillStyle = '#f0e0b0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    // swing
    if (lampOn) {
      lampAng += SWING_SPD * lampDir;
      if (lampAng >=  RANGE) { lampAng =  RANGE; lampDir = -1; }
      if (lampAng <= -RANGE) { lampAng = -RANGE; lampDir =  1; }
    }

    // lamp tip
    const TX = PIVOT_X + Math.sin(lampAng) * CORD;
    const TY_tip = PIVOT_Y + Math.cos(lampAng) * CORD;

    // lamp drawn FIRST (behind beam)
    drawLamp(TX, TY_tip);

    if (lampOn) {
      /* beam — vertical triangle from tip, straight down */
      const B_TOP_L = TX - 2;
      const B_TOP_R = TX + 2;
      const B_BOT_L = TX - BEAM_HALF;
      const B_BOT_R = TX + BEAM_HALF;
      const B_BOT_Y = TY_tip + BEAM_LEN;

      // beam gradient
      ctx.save();
      const bg = ctx.createLinearGradient(TX, TY_tip, TX, B_BOT_Y);
      bg.addColorStop(0,    'rgba(255,248,190,0.50)');
      bg.addColorStop(0.25, 'rgba(230,195,90,0.22)');
      bg.addColorStop(0.7,  'rgba(201,168,76,0.08)');
      bg.addColorStop(1,    'rgba(201,168,76,0.00)');
      ctx.beginPath();
      ctx.moveTo(B_TOP_L, TY_tip);
      ctx.lineTo(B_BOT_L, B_BOT_Y);
      ctx.lineTo(B_BOT_R, B_BOT_Y);
      ctx.lineTo(B_TOP_R, TY_tip);
      ctx.closePath();
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.restore();

      /* text — clipped to same beam triangle */
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(B_TOP_L, TY_tip);
      ctx.lineTo(B_BOT_L, B_BOT_Y);
      ctx.lineTo(B_BOT_R, B_BOT_Y);
      ctx.lineTo(B_TOP_R, TY_tip);
      ctx.closePath();
      ctx.clip();

      LINES.forEach((ln, i) => {
        const ly = TY + i * LH + LH / 2;
        ctx.font        = `900 ${fs}px Arial Black, Arial, sans-serif`;
        ctx.textAlign   = 'center';
        ctx.textBaseline = 'middle';
        // measure for gradient
        const tw = ctx.measureText(ln).width;
        // glow pass
        ctx.save();
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur  = mob ? 28 : 45;
        ctx.fillStyle   = 'rgba(255,215,0,0.55)';
        ctx.fillText(ln, W/2, ly);
        ctx.restore();
        // gold gradient pass
        const grd = ctx.createLinearGradient(W/2-tw/2, 0, W/2+tw/2, 0);
        grd.addColorStop(0,    '#8b6010');
        grd.addColorStop(0.25, '#f5e6b8');
        grd.addColorStop(0.5,  '#ffd700');
        grd.addColorStop(0.75, '#f5e6b8');
        grd.addColorStop(1,    '#8b6010');
        ctx.save();
        ctx.shadowColor  = '#c9a84c';
        ctx.shadowBlur   = mob ? 12 : 20;
        ctx.fillStyle    = grd;
        ctx.fillText(ln, W/2, ly);
        ctx.restore();
      });

      ctx.restore(); // end clip
    }
  })();

  requestAnimationFrame(() => requestAnimationFrame(() => wrap.style.opacity = '1'));
}


/* ══════════════════════════════════════════════
   WAX SEAL — gold 'P' seal, tap to crack open
══════════════════════════════════════════════ */
function showWaxSeal(onDone) {
  const W   = window.innerWidth;
  const H   = window.innerHeight || document.documentElement.clientHeight;
  const mob = W < 600;

  /* overlay */
  const ov = document.createElement('div');
  ov.style.cssText = `
    position:fixed;inset:0;z-index:9500;
    background:rgba(4,3,1,0.96);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    opacity:0;transition:opacity .7s ease;
    -webkit-tap-highlight-color:transparent;
  `;
  document.body.appendChild(ov);
  ov.classList.add('crt-flicker');
  const sealCRT = document.createElement('div');
  sealCRT.className = 'crt-overlay';
  ov.appendChild(sealCRT);

  /* label */
  const lbl = document.createElement('div');
  lbl.textContent = '— a message for you —';
  lbl.style.cssText = `
    font-family:'Press Start 2P',monospace;
    font-size:${mob?'8px':'10px'};letter-spacing:${mob?'1px':'2px'};
    color:rgba(201,168,76,0.55);text-transform:lowercase;
    margin-bottom:${mob?'32px':'44px'};
    opacity:0;transition:opacity 1s ease;
    line-height:1.8;text-align:center;padding:0 24px;
  `;
  ov.appendChild(lbl);

  /* seal canvas */
  const SIZE = mob ? 180 : 240;
  const cv   = document.createElement('canvas');
  cv.width   = SIZE * 2; cv.height = SIZE * 2;
  cv.style.cssText = `width:${SIZE}px;height:${SIZE}px;cursor:pointer;filter:drop-shadow(0 0 32px rgba(201,168,76,0.45));transition:filter .3s,transform .3s;`;
  ov.appendChild(cv);
  const ctx  = cv.getContext('2d');
  ctx.scale(2, 2); // retina
  const CX   = SIZE/2, CY = SIZE/2, R = SIZE*0.44;

  /* hint */
  const hint = document.createElement('div');
  hint.textContent = 'tap the seal to open';
  hint.style.cssText = `
    font-family:'Press Start 2P',monospace;
    font-size:${mob?'8px':'10px'};letter-spacing:1px;
    color:rgba(201,168,76,0);margin-top:${mob?'28px':'36px'};
    transition:color 1.2s ease;
  `;
  ov.appendChild(hint);

  /* draw intact wax seal */
  function drawSeal(glowPulse) {
    ctx.clearRect(0, 0, SIZE, SIZE);

    /* outer ring glow */
    const glow = ctx.createRadialGradient(CX,CY,R*0.6, CX,CY,R*1.3);
    glow.addColorStop(0,   `rgba(201,168,76,${0.18+glowPulse*0.12})`);
    glow.addColorStop(0.6, `rgba(180,140,40,${0.08+glowPulse*0.06})`);
    glow.addColorStop(1,   'rgba(201,168,76,0)');
    ctx.beginPath(); ctx.arc(CX,CY,R*1.3,0,Math.PI*2);
    ctx.fillStyle = glow; ctx.fill();

    /* main seal body — rich red-gold wax */
    const body = ctx.createRadialGradient(CX-R*0.2, CY-R*0.2, R*0.05, CX,CY,R);
    body.addColorStop(0,   '#c9a84c');
    body.addColorStop(0.3, '#a07828');
    body.addColorStop(0.7, '#7a5010');
    body.addColorStop(1,   '#4a2e05');
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.fillStyle = body; ctx.fill();

    /* embossed ring */
    ctx.beginPath(); ctx.arc(CX,CY,R*0.88,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(245,230,180,0.6)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(CX,CY,R*0.78,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(245,230,180,0.3)';
    ctx.lineWidth = 1; ctx.stroke();

    /* decorative dots around ring */
    for (let i=0;i<12;i++) {
      const a = (i/12)*Math.PI*2;
      const dx = CX + Math.cos(a)*R*0.83;
      const dy = CY + Math.sin(a)*R*0.83;
      ctx.beginPath(); ctx.arc(dx,dy,2,0,Math.PI*2);
      ctx.fillStyle='rgba(245,230,160,0.7)'; ctx.fill();
    }

    /* letter P — gold embossed */
    ctx.save();
    ctx.shadowColor = 'rgba(255,240,160,0.8)';
    ctx.shadowBlur  = 10;
    ctx.fillStyle   = 'rgba(255,240,160,0.92)';
    ctx.font        = `bold ${Math.round(R*0.95)}px 'Cormorant Garamond',serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText('P', CX, CY+2);
    ctx.restore();

    /* shine highlight */
    const shine = ctx.createRadialGradient(CX-R*0.3, CY-R*0.35, 0, CX-R*0.1, CY-R*0.15, R*0.55);
    shine.addColorStop(0,   'rgba(255,248,210,0.28)');
    shine.addColorStop(0.5, 'rgba(255,240,180,0.08)');
    shine.addColorStop(1,   'rgba(255,240,180,0)');
    ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
    ctx.fillStyle = shine; ctx.fill();
  }

  /* breathing glow animation */
  let glowT = 0, animId;
  (function glowLoop() {
    animId = requestAnimationFrame(glowLoop);
    glowT += 0.025;
    drawSeal(Math.sin(glowT)*0.5+0.5);
  })();

  /* crack animation — seal splits into shards */
  function crackSeal() {
    cancelAnimationFrame(animId);
    cv.style.cursor  = 'default';
    cv.style.filter  = 'drop-shadow(0 0 55px rgba(255,220,80,0.95))';
    cv.style.transform = 'scale(1.08)';

    let frame = 0;
    const SHARDS = 12;
    const shards = Array.from({length:SHARDS}, (_, i) => {
      const a  = (i/SHARDS)*Math.PI*2 + Math.random()*0.4;
      const spd = 1.8 + Math.random()*2.2;
      return {
        a, spd,
        vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
        rot: (Math.random()-.5)*0.25,
        rotV: (Math.random()-.5)*0.18,
        alpha: 1,
        // shard is a slice of the circle
        startA: a - Math.PI/SHARDS,
        endA:   a + Math.PI/SHARDS,
      };
    });

    (function crackLoop() {
      ctx.clearRect(0,0,SIZE,SIZE);
      frame++;
      // flash on first frames
      if (frame < 4) {
        ctx.save();
        ctx.globalAlpha = (4-frame)/4 * 0.7;
        ctx.fillStyle = '#fffbe0';
        ctx.beginPath(); ctx.arc(CX,CY,R*1.2,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      let allGone = true;
      shards.forEach(s => {
        s.vx += Math.cos(s.a)*0.15;
        s.vy += Math.sin(s.a)*0.15 + 0.08; // gravity
        s.alpha -= 0.028;
        if (s.alpha > 0) allGone = false;
        if (s.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.translate(CX + s.vx*(frame*1.2), CY + s.vy*(frame*1.2));
        ctx.rotate(s.rotV * frame);
        // draw shard (pie slice with wax colour)
        const body2 = ctx.createRadialGradient(0,0,0, 0,0,R);
        body2.addColorStop(0,'#c9a84c'); body2.addColorStop(0.5,'#8a5e18'); body2.addColorStop(1,'#4a2e05');
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,R,s.startA,s.endA);
        ctx.closePath();
        ctx.fillStyle = body2;
        ctx.fill();
        ctx.restore();
      });
      if (!allGone) { requestAnimationFrame(crackLoop); }
      else { finish(); }
    })();
  }

  function finish() {
    hint.style.color = 'rgba(201,168,76,0)';
    ov.style.opacity = '0';
    setTimeout(() => { ov.remove(); onDone(); }, 700);
  }

  /* tap to crack */
  cv.addEventListener('click',    crackSeal);
  cv.addEventListener('touchend', e => { e.preventDefault(); crackSeal(); }, {passive:false});
  cv.addEventListener('mouseenter', () => {
    cv.style.filter    = 'drop-shadow(0 0 44px rgba(201,168,76,0.7))';
    cv.style.transform = 'scale(1.05)';
  });
  cv.addEventListener('mouseleave', () => {
    cv.style.filter    = 'drop-shadow(0 0 32px rgba(201,168,76,0.45))';
    cv.style.transform = 'scale(1)';
  });

  /* entrance */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ov.style.opacity = '1';
    setTimeout(() => lbl.style.opacity = '1', 400);
    setTimeout(() => hint.style.color = 'rgba(201,168,76,0.6)', 1200);
  }));
}

/* ══════════════════════════════════════════════
   ROSE BLOOM — closed bud, tap to bloom open
   Rose grows from bud → full bloom → card reveals
══════════════════════════════════════════════ */
function showRoseBloom(onDone) {
  const wrap = document.createElement('div');
  wrap.style.cssText = `
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:5000;background:#000;cursor:pointer;
    opacity:0;transition:opacity .8s ease;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  `;

  const isMob = window.innerWidth < 600;
  const EW = isMob ? 220 : 300;  // envelope width
  const EH = EW * 0.65;          // envelope height

  // Canvas for envelope
  const ec = document.createElement('canvas');
  ec.width  = EW; ec.height = EH;
  ec.style.cssText = `display:block;cursor:pointer;`;
  wrap.appendChild(ec);
  const ex = ec.getContext('2d');

  // Prompt text
  const label = document.createElement('div');
  label.style.cssText = `
    margin-top:clamp(16px,3vh,24px);
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(14px,3.5vw,20px);
    color:rgba(240,210,130,0.9); letter-spacing:2px;
    text-align:center; text-shadow:0 0 14px rgba(180,145,50,0.6);
  `;

  const hint = document.createElement('div');
  hint.style.cssText = `
    margin-top:8px;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:clamp(11px,2.5vw,14px);
    color:rgba(201,168,76,0.45); letter-spacing:2px;
    text-align:center; opacity:0; transition:opacity .8s ease;
  `;
  hint.textContent = '— tap to open —';
  wrap.appendChild(label);
  wrap.appendChild(hint);

  // Falling sakura petals background
  const bg = document.createElement('canvas');
  bg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  bg.width=window.innerWidth; bg.height=window.innerHeight || document.documentElement.clientHeight;
  wrap.insertBefore(bg, ec.parentNode ? null : ec);
  wrap.insertBefore(bg, wrap.firstChild);
  ec.style.position='relative'; ec.style.zIndex='1';
  label.style.position='relative'; label.style.zIndex='1';
  hint.style.position='relative'; hint.style.zIndex='1';
  const bx = bg.getContext('2d');
  const bgPetals = Array.from({length:40},()=>({
    x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
    r:2+Math.random()*3, vx:(Math.random()-.5)*.6, vy:.3+Math.random()*.8,
    spin:Math.random()*Math.PI*2, spinV:(Math.random()-.5)*.05,
    alpha:.15+Math.random()*.4,
    color:`hsl(${Math.round(335+Math.random()*30)},${Math.round(70+Math.random()*20)}%,${Math.round(75+Math.random()*18)}%)`
  }));

  document.body.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ wrap.style.opacity='1'; }));

  // ── ENVELOPE STATE ──
  let phase     = 'idle';   // idle → open → done
  let lidAngle  = 0;        // 0=closed, 1=fully open (0..1)
  let lidDir    = 0;
  let doneCalled= false;
  let shimmer   = 0;

  // Type label
  const PROMPT  = 'A message for you...';
  let pi = 0;
  function typeLabel(){
    if(pi<PROMPT.length){ label.textContent+=PROMPT[pi++]; setTimeout(typeLabel,65); }
    else setTimeout(()=>{ hint.style.opacity='1'; },400);
  }
  setTimeout(typeLabel, 500);

  function drawEnvelope(t) {
    ex.clearRect(0,0,EW,EH);
    const W=EW, H=EH;
    const r=10; // corner radius

    // ── ENVELOPE BODY ──
    ex.save();
    const bodyG=ex.createLinearGradient(0,0,W,H);
    bodyG.addColorStop(0,'#1a1500');
    bodyG.addColorStop(0.5,'#3a3000');
    bodyG.addColorStop(1,'#1a1500');
    ex.fillStyle=bodyG;
    ex.shadowColor='rgba(180,145,50,0.5)'; ex.shadowBlur=20;
    ex.beginPath();
    ex.moveTo(r,0); ex.lineTo(W-r,0); ex.quadraticCurveTo(W,0,W,r);
    ex.lineTo(W,H-r); ex.quadraticCurveTo(W,H,W-r,H);
    ex.lineTo(r,H); ex.quadraticCurveTo(0,H,0,H-r);
    ex.lineTo(0,r); ex.quadraticCurveTo(0,0,r,0);
    ex.closePath(); ex.fill();
    // Border
    ex.strokeStyle='rgba(201,168,76,0.45)'; ex.lineWidth=1.5; ex.stroke();
    ex.restore();

    // ── ENVELOPE INNER DIAGONAL LINES (bottom V) ──
    ex.save();
    ex.globalAlpha=0.35;
    ex.strokeStyle='rgba(201,168,76,0.5)'; ex.lineWidth=1;
    // Left diagonal
    ex.beginPath(); ex.moveTo(0,0); ex.lineTo(W/2,H*.6); ex.stroke();
    // Right diagonal
    ex.beginPath(); ex.moveTo(W,0); ex.lineTo(W/2,H*.6); ex.stroke();
    // Bottom left
    ex.beginPath(); ex.moveTo(0,H); ex.lineTo(W/2,H*.6); ex.stroke();
    // Bottom right
    ex.beginPath(); ex.moveTo(W,H); ex.lineTo(W/2,H*.6); ex.stroke();
    ex.restore();

    // ── WAX SEAL ──
    if(lidAngle<0.3){
      const sealX=W/2, sealY=H*.55;
      ex.save();
      const sealG=ex.createRadialGradient(sealX-4,sealY-4,0,sealX,sealY,18);
      sealG.addColorStop(0,'#f0d060'); sealG.addColorStop(0.5,'#a07020'); sealG.addColorStop(1,'#604010');
      ex.fillStyle=sealG; ex.shadowColor='#c9a84c'; ex.shadowBlur=15;
      ex.beginPath(); ex.arc(sealX,sealY,14*(1-lidAngle*3),0,Math.PI*2); ex.fill();
      // Seal letter C
      ex.globalAlpha=1-lidAngle*3;
      ex.fillStyle='rgba(255,245,200,0.9)'; ex.shadowBlur=0;
      ex.font=`bold ${isMob?10:13}px Georgia,serif`;
      ex.textAlign='center'; ex.textBaseline='middle';
      ex.fillText('C',sealX,sealY);
      ex.restore();
    }

    // ── SHIMMERING RIBBON ──
    shimmer=(shimmer+0.04)%1;
    const ribW=W*.08;
    ex.save();
    const ribG=ex.createLinearGradient(W/2-ribW/2,0,W/2+ribW/2,0);
    ribG.addColorStop(0,'rgba(255,100,150,0.3)');
    ribG.addColorStop(0.4,'rgba(255,200,220,0.9)');
    ribG.addColorStop(0.6,'rgba(255,200,220,0.9)');
    ribG.addColorStop(1,'rgba(255,100,150,0.3)');
    ex.fillStyle=ribG; ex.shadowColor='#f0e0a0'; ex.shadowBlur=8;
    ex.fillRect(W/2-ribW/2,0,ribW,H);
    ex.restore();

    // ── LID — flips open ──
    ex.save();
    ex.translate(W/2, 0);
    // Perspective flip: scaleY goes 1→0→-1 as lid opens
    const scaleY = Math.cos(lidAngle * Math.PI);
    ex.scale(1, scaleY);
    // Lid triangle
    const lidG=ex.createLinearGradient(-W/2,0,W/2,H*.55);
    lidG.addColorStop(0,'#1a1500'); lidG.addColorStop(0.5,'#3a3000'); lidG.addColorStop(1,'#1a1500');
    ex.fillStyle=lidG;
    ex.shadowColor='rgba(255,100,150,0.4)'; ex.shadowBlur=10;
    ex.beginPath(); ex.moveTo(-W/2,0); ex.lineTo(0,H*.55); ex.lineTo(W/2,0); ex.closePath(); ex.fill();
    ex.strokeStyle='rgba(255,150,180,0.4)'; ex.lineWidth=1; ex.stroke();
    // Lid ribbon continuation
    ex.fillStyle=ribG; ex.shadowColor='#f0e0a0'; ex.shadowBlur=8;
    ex.fillRect(-ribW/2,0,ribW,H*.55);
    ex.restore();

    // ── SPARKLES when opening ──
    if(phase==='open' && lidAngle>0.3){
      const sp=(lidAngle-.3)/.7;
      for(let s=0;s<6;s++){
        const sa=(s/6)*Math.PI*2+t*2;
        const sr=W*.3*sp;
        ex.save();
        ex.globalAlpha=sp*(0.5+Math.abs(Math.sin(t*3+s))*.5);
        ex.fillStyle='#ffd700'; ex.shadowColor='#ffd700'; ex.shadowBlur=8;
        ex.font=`${isMob?9:11}px serif`; ex.textAlign='center';
        ex.fillText('✦',W/2+Math.cos(sa)*sr,H/2+Math.sin(sa)*sr*.6);
        ex.restore();
      }
    }

    // ── GLOW PULSE when idle ──
    const pulse=0.5+Math.abs(Math.sin(t*1.8))*.5;
    ex.save();
    ex.globalAlpha=pulse*0.3;
    ex.strokeStyle='rgba(255,150,180,0.6)'; ex.lineWidth=2;
    ex.shadowColor='#c9a84c'; ex.shadowBlur=15;
    ex.beginPath();
    ex.moveTo(r,0); ex.lineTo(W-r,0); ex.quadraticCurveTo(W,0,W,r);
    ex.lineTo(W,H-r); ex.quadraticCurveTo(W,H,W-r,H);
    ex.lineTo(r,H); ex.quadraticCurveTo(0,H,0,H-r);
    ex.lineTo(0,r); ex.quadraticCurveTo(0,0,r,0);
    ex.closePath(); ex.stroke();
    ex.restore();
  }

  let rafId;
  function loop(){
    const t=performance.now()/1000;

    // Bg petals
    bx.clearRect(0,0,bg.width,bg.height);
    bgPetals.forEach(p=>{
      p.x+=p.vx+Math.sin(p.spin*.3)*.3; p.y+=p.vy; p.spin+=p.spinV;
      if(p.y>bg.height+10){p.y=-10;p.x=Math.random()*bg.width;}
      bx.save(); bx.globalAlpha=p.alpha; bx.translate(p.x,p.y); bx.rotate(p.spin);
      bx.fillStyle=p.color; bx.shadowColor=p.color; bx.shadowBlur=5;
      bx.beginPath(); bx.ellipse(0,0,p.r,p.r*1.6,0,0,Math.PI*2); bx.fill(); bx.restore();
    });

    // Envelope open animation
    if(phase==='open'){
      lidAngle=Math.min(lidAngle+0.025,1);
      if(lidAngle>=1 && !doneCalled){
        doneCalled=true;
        setTimeout(()=>{
          let a=1;
          const fi=setInterval(()=>{
            a-=.03; wrap.style.opacity=Math.max(0,a);
            if(a<=0){clearInterval(fi);wrap.remove();onDone();}
          },20);
        },600);
      }
    }

    drawEnvelope(t);
    rafId=requestAnimationFrame(loop);
  }
  loop();

  function handleTap(){
    if(phase!=='idle') return;
    phase='open'; lidAngle=0;
    label.style.opacity='0'; hint.style.opacity='0';
  }
  ec.addEventListener('click', handleTap);
  wrap.addEventListener('click', handleTap);
  wrap.addEventListener('touchstart',e=>{e.preventDefault();handleTap();},{passive:false});
}

        card.style.opacity    = '0';

}

/* ══════════════════════════════════════════════
   BIRTHDAY BOSS RUSH — 3 bosses, tap to dodge & shoot
══════════════════════════════════════════════ */
function showBossRush(onDone) {
  let W   = window.innerWidth;
  let H   = window.innerHeight || document.documentElement.clientHeight;
  let mob = W < 600;
  let DPR = Math.min(window.devicePixelRatio||1,2);
  // Real touch capability (not just narrow width) — lets tablets/touch-laptops
  // get on-screen buttons even in a wide landscape window, and keeps a resized
  // desktop browser window from suddenly showing phantom touch buttons.
  let hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  /* wrapper */
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;z-index:6500;background:#05040a;overflow:hidden;opacity:0;transition:opacity .7s ease;';
  document.body.appendChild(wrap);
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.style.opacity='1'));

  /* canvas */
  const cv  = document.createElement('canvas');
  cv.width  = W*DPR; cv.height = H*DPR;
  cv.style.cssText = `position:absolute;inset:0;width:${W}px;height:${H}px;touch-action:none;`;
  wrap.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.scale(DPR,DPR);

  /* HUD overlay */
  const hud = document.createElement('div');
  hud.style.cssText = `position:absolute;top:0;left:0;right:0;padding:${mob?'12px 16px':'16px 24px'};
    display:flex;justify-content:space-between;align-items:center;z-index:2;
    font-family:'Cormorant Garamond',serif;pointer-events:none;`;
  wrap.appendChild(hud);

  const hudL = document.createElement('div');
  hudL.style.cssText = `font-size:${mob?'13px':'16px'};color:rgba(201,168,76,0.9);letter-spacing:2px;`;
  const hudR = document.createElement('div');
  hudR.style.cssText = `font-size:${mob?'13px':'16px'};color:rgba(240,220,160,0.85);letter-spacing:2px;`;
  hud.appendChild(hudL); hud.appendChild(hudR);

  /* ── GAME CONSTANTS (recomputed on resize — see resize() below) ── */
  let PW   = mob?28:38, PH = mob?32:44;   // player size
  let FLOOR= H - (mob?80:100);             // player floor y
  let CX   = W/2;
  let CY   = H/2;

  /* ── BOSSES definition ── */
  const BOSSES = [
    { name:'CAKE GOLEM',    hp:18, maxhp:18, col:'#c9a84c', col2:'#7a5010', atk:'slow',  spd:0.8,  reward:'🎂' },
    { name:'STAR WITCH',    hp:26, maxhp:26, col:'#9b7fd4', col2:'#4a2080', atk:'spread', spd:1.2, reward:'⭐' },
    { name:'GOLDEN DRAGON', hp:36, maxhp:36, col:'#ffd700', col2:'#b8860b', atk:'fast',   spd:1.6, reward:'🐉' },
  ];

  /* ── STATE ── */
  let bossIdx    = 0;
  let boss       = {...BOSSES[0]};
  let bossX      = CX;
  let bossY      = mob ? H*0.22 : H*0.20;
  let bossDir    = 1;
  let bossT      = 0;

  let pX         = CX;          // player x
  let pVX        = 0;           // player x velocity
  let pY         = FLOOR;
  let pJumping   = false;
  let pVY        = 0;
  let pHP        = 5;
  let invincible = 0;           // frames of invincibility after hit

  let bullets    = [];          // player bullets {x,y,vy?}
  let enemyBullets = [];        // enemy bullets {x,y,vx,vy,r}
  let particles  = [];          // hit particles
  let shootCooldown = 0;

  let phase      = 'intro';     // intro|fight|bossdie|win|lose
  let phaseTimer = 0;
  let score      = 0;
  let raf;

  /* ── INPUT ── */
  const keys = {};
  document.addEventListener('keydown', e=>{ keys[e.key]=true; });
  document.addEventListener('keyup',   e=>{ keys[e.key]=false; });

  // Touch controls
  const touchState = {left:false, right:false, jump:false, shoot:false};
  let CTRL_SIZE  = mob ? 56 : 70;
  let CTRL_Y     = H - (mob?52:64);
  let CTRL_PAD   = mob ? 18 : 28;

  function touchHit(tx,ty) {
    // Left
    if (tx<W*0.25 && ty>H*0.6) touchState.left=true;
    // Right
    if (tx>W*0.25 && tx<W*0.5 && ty>H*0.6) touchState.right=true;
    // Jump (right side upper)
    if (tx>W*0.6 && ty>H*0.55 && ty<H*0.78) touchState.jump=true;
    // Shoot (right side lower)
    if (tx>W*0.6 && ty>H*0.78) touchState.shoot=true;
  }

  wrap.addEventListener('touchstart', e=>{
    [...e.changedTouches].forEach(t=>touchHit(t.clientX,t.clientY));
  },{passive:true});
  wrap.addEventListener('touchend', e=>{
    touchState.left=touchState.right=touchState.jump=touchState.shoot=false;
  },{passive:true});
  wrap.addEventListener('touchmove', e=>{
    touchState.left=touchState.right=touchState.jump=touchState.shoot=false;
    [...e.changedTouches].forEach(t=>touchHit(t.clientX,t.clientY));
  },{passive:true});

  /* ── RESPONSIVE: recompute everything on resize / orientation change ── */
  function handleResize() {
    W   = window.innerWidth;
    H   = window.innerHeight || document.documentElement.clientHeight;
    mob = W < 600;
    DPR = Math.min(window.devicePixelRatio||1,2);

    cv.width  = W*DPR; cv.height = H*DPR;
    cv.style.width  = W+'px';
    cv.style.height = H+'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(DPR,DPR);

    PW = mob?28:38; PH = mob?32:44;
    FLOOR = H - (mob?80:100);
    CX = W/2; CY = H/2;
    CTRL_SIZE = mob ? 56 : 70;
    CTRL_Y    = H - (mob?52:64);
    CTRL_PAD  = mob ? 18 : 28;

    hud.style.padding = mob ? '12px 16px' : '16px 24px';
    hudL.style.fontSize = mob ? '13px' : '16px';
    hudR.style.fontSize = mob ? '13px' : '16px';

    // Keep active entities inside the new bounds instead of stranding them
    pX = Math.max(PW/2, Math.min(W-PW/2, pX));
    if (!pJumping) pY = FLOOR;
    bossX = Math.max(60, Math.min(W-60, bossX));
    bossY = mob ? H*0.22 : H*0.20;
  }
  window.addEventListener('resize', handleResize);
  let orientationTimer;
  window.addEventListener('orientationchange', ()=>{
    clearTimeout(orientationTimer);
    orientationTimer = setTimeout(handleResize, 300);
  });

  /* ── HELPERS ── */
  function spawnBossBullet() {
    const dx = pX - bossX, dy = pY - bossY;
    const dist = Math.sqrt(dx*dx+dy*dy)||1;
    const spd  = 3.5 + bossIdx*1.2;
    if (boss.atk==='slow') {
      enemyBullets.push({x:bossX, y:bossY+20, vx:(dx/dist)*spd*0.7, vy:(dy/dist)*spd*0.7, r:mob?9:12});
    } else if (boss.atk==='spread') {
      [-0.3,0,0.3].forEach(off=>{
        const a = Math.atan2(dy,dx)+off;
        enemyBullets.push({x:bossX, y:bossY+20, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:mob?7:9});
      });
    } else {
      enemyBullets.push({x:bossX, y:bossY+20, vx:(dx/dist)*spd*1.4, vy:(dy/dist)*spd*1.4, r:mob?6:8});
    }
  }

  function spawnParticles(x,y,col,n) {
    for(let i=0;i<n;i++) {
      const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*3;
      particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,col});
    }
  }

  function nextBoss() {
    bossIdx++;
    if (bossIdx>=BOSSES.length) { phase='win'; phaseTimer=0; return; }
    boss  = {...BOSSES[bossIdx]};
    bossX = CX; bossY = mob?H*0.22:H*0.20;
    bossDir=1; bossT=0;
    enemyBullets=[];
    phase='intro'; phaseTimer=0;
  }

  /* ── PIXEL ART DRAW HELPERS ── */
  function drawPlayer(x,y) {
    const f = Math.floor(Date.now()/200)%2; // animation frame
    const S = mob?2:3;
    // body
    ctx.fillStyle = invincible>0 && Math.floor(invincible/4)%2 ? 'rgba(255,255,255,0.5)' : '#f0d060';
    ctx.fillRect(x-5*S,y-10*S,10*S,10*S);
    // head
    ctx.fillStyle='#fde68a';
    ctx.fillRect(x-4*S,y-17*S,8*S,7*S);
    // eyes
    ctx.fillStyle='#1a1200';
    ctx.fillRect(x-3*S,y-15*S,2*S,2*S);
    ctx.fillRect(x+1*S,y-15*S,2*S,2*S);
    // hair
    ctx.fillStyle='#c9a84c';
    ctx.fillRect(x-4*S,y-19*S,8*S,3*S);
    // legs
    ctx.fillStyle='#8b6010';
    ctx.fillRect(x-4*S,y-(f?2:1)*S,3*S,3*S);
    ctx.fillRect(x+1*S,y-(f?1:2)*S,3*S,3*S);
  }

  function drawBoss(x,y,b) {
    const S = mob?2.5:3.5;
    const t = Date.now()/400;
    const bob = Math.sin(t)*3;
    ctx.save();
    ctx.translate(x, y+bob);

    if (bossIdx===0) {
      // CAKE GOLEM — round chunky body
      ctx.fillStyle=b.col2;
      ctx.fillRect(-7*S,-12*S,14*S,12*S); // body
      ctx.fillStyle=b.col;
      ctx.fillRect(-6*S,-14*S,12*S,4*S);  // frosting
      ctx.fillStyle='#fff';
      ctx.fillRect(-4*S,-17*S,2*S,4*S);ctx.fillRect(2*S,-17*S,2*S,4*S); // candles
      ctx.fillStyle='#ff8c00';
      ctx.fillRect(-4*S,-18*S,2*S,1*S);ctx.fillRect(2*S,-18*S,2*S,1*S); // flame
      // eyes
      ctx.fillStyle='#1a0a00';
      ctx.fillRect(-4*S,-9*S,3*S,3*S);ctx.fillRect(1*S,-9*S,3*S,3*S);
      // mouth
      ctx.fillStyle='#ff4400';
      ctx.fillRect(-3*S,-5*S,6*S,2*S);
    } else if (bossIdx===1) {
      // STAR WITCH — pointy hat, stars
      ctx.fillStyle=b.col2;
      ctx.fillRect(-6*S,-10*S,12*S,10*S); // robe
      ctx.fillStyle=b.col;
      // hat
      ctx.beginPath();
      ctx.moveTo(0,-22*S);ctx.lineTo(-6*S,-10*S);ctx.lineTo(6*S,-10*S);
      ctx.closePath();ctx.fill();
      // face
      ctx.fillStyle='#e8d4f0';
      ctx.fillRect(-4*S,-16*S,8*S,6*S);
      // eyes
      ctx.fillStyle='#2a0050';
      ctx.fillRect(-3*S,-14*S,2*S,2*S);ctx.fillRect(1*S,-14*S,2*S,2*S);
      // stars orbiting
      for(let i=0;i<3;i++){
        const a=t*1.5+(i/3)*Math.PI*2;
        ctx.fillStyle='#ffd700';
        ctx.fillRect(Math.cos(a)*9*S-S,-12*S+Math.sin(a)*5*S-S,2*S,2*S);
      }
    } else {
      // GOLDEN DRAGON — large, majestic
      ctx.fillStyle=b.col;
      ctx.fillRect(-9*S,-10*S,18*S,10*S); // body
      ctx.fillStyle=b.col2;
      // scales
      for(let i=0;i<3;i++) ctx.fillRect((-6+i*4)*S,-8*S,3*S,6*S);
      // head
      ctx.fillStyle=b.col;
      ctx.fillRect(-10*S,-16*S,12*S,8*S);
      // horns
      ctx.fillStyle='#fff';
      ctx.fillRect(-9*S,-22*S,2*S,7*S);ctx.fillRect(-4*S,-22*S,2*S,7*S);
      // eyes
      ctx.fillStyle='#ff2200';
      ctx.fillRect(-8*S,-14*S,3*S,3*S);ctx.fillRect(-2*S,-14*S,3*S,3*S);
      // wings
      ctx.fillStyle='rgba(255,215,0,0.6)';
      ctx.fillRect(6*S,-14*S,8*S,6*S);ctx.fillRect(-14*S,-14*S,8*S,6*S);
      // fire breath (animated)
      if(Math.sin(t*3)>0){
        ctx.fillStyle='rgba(255,120,0,0.8)';
        ctx.fillRect(-12*S,-12*S,4*S,2*S);
        ctx.fillStyle='rgba(255,200,0,0.9)';
        ctx.fillRect(-14*S,-12*S,3*S,2*S);
      }
    }
    ctx.restore();
  }

  function drawBG() {
    // Dark starry background
    ctx.fillStyle='#05040a';
    ctx.fillRect(0,0,W,H);
    // Stars
    ctx.fillStyle='rgba(201,168,76,0.4)';
    for(let i=0;i<40;i++){
      const sx=(Math.sin(i*1.3)*0.5+0.5)*W;
      const sy=(Math.cos(i*1.7)*0.5+0.5)*H*0.75;
      ctx.fillRect(sx,sy,1+(i%3),1+(i%2));
    }
    // Ground
    const gg=ctx.createLinearGradient(0,FLOOR,0,H);
    gg.addColorStop(0,'rgba(201,168,76,0.25)');
    gg.addColorStop(1,'rgba(100,80,10,0.08)');
    ctx.fillStyle=gg;
    ctx.fillRect(0,FLOOR,W,H-FLOOR);
    ctx.fillStyle='rgba(201,168,76,0.6)';
    ctx.fillRect(0,FLOOR,W,2);
  }

  function drawHPBar(x,y,w,hp,maxhp,col) {
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(x,y,w,mob?8:10);
    const fw=(hp/maxhp)*w;
    const g=ctx.createLinearGradient(x,0,x+fw,0);
    g.addColorStop(0,col); g.addColorStop(1,'#fff8c0');
    ctx.fillStyle=g;
    ctx.fillRect(x,y,fw,mob?8:10);
    ctx.strokeStyle='rgba(201,168,76,0.5)';
    ctx.lineWidth=1; ctx.strokeRect(x,y,w,mob?8:10);
  }

  function drawControls() {
    if (!hasTouch) {
      // Desktop/keyboard hint — shown only for the first couple seconds of
      // boss 1's fight, then fades out of the way so it never covers gameplay.
      if (bossIdx===0 && phaseTimer<230) {
        const a = Math.max(0, Math.min(0.6, 0.6-(phaseTimer-110)/100));
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = `italic ${mob?12:14}px 'Cormorant Garamond',serif`;
        ctx.fillStyle = '#f0d060';
        ctx.textAlign = 'center'; ctx.textBaseline='middle';
        ctx.fillText('◀ ▶ / A D move   •   ▲ / W / Space jump   •   Z / X / Enter shoot', CX, H-24);
        ctx.restore();
      }
      return;
    }
    const a=0.35;
    const S=CTRL_SIZE;
    // Left
    ctx.save(); ctx.globalAlpha=touchState.left?0.7:a;
    ctx.fillStyle='rgba(201,168,76,0.2)'; ctx.strokeStyle='rgba(201,168,76,0.5)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(CTRL_PAD+S/2,CTRL_Y,S/2,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f0d060'; ctx.font=`${S*0.4}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('◀',CTRL_PAD+S/2,CTRL_Y);
    // Right
    ctx.globalAlpha=touchState.right?0.7:a;
    ctx.fillStyle='rgba(201,168,76,0.2)';
    ctx.beginPath(); ctx.arc(CTRL_PAD+S*1.7,CTRL_Y,S/2,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f0d060';
    ctx.fillText('▶',CTRL_PAD+S*1.7,CTRL_Y);
    // Jump
    ctx.globalAlpha=touchState.jump?0.7:a;
    ctx.fillStyle='rgba(201,168,76,0.2)';
    ctx.beginPath(); ctx.arc(W-CTRL_PAD-S*1.7,CTRL_Y-S*0.6,S/2,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f0d060';
    ctx.fillText('▲',W-CTRL_PAD-S*1.7,CTRL_Y-S*0.6);
    // Shoot
    ctx.globalAlpha=touchState.shoot?0.7:a;
    ctx.fillStyle='rgba(255,100,100,0.2)'; ctx.strokeStyle='rgba(255,150,150,0.5)';
    ctx.beginPath(); ctx.arc(W-CTRL_PAD-S*0.5,CTRL_Y+S*0.1,S/2,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffaaaa';
    ctx.fillText('✦',W-CTRL_PAD-S*0.5,CTRL_Y+S*0.1);
    ctx.restore();
  }

  /* ── MAIN LOOP ── */
  let lastBulletTime=0, lastEnemyBulletTime=0;
  const SHOOT_RATE = 320;
  let enemyShootRate = 1400;

  (function loop() {
    raf = requestAnimationFrame(loop);
    const now = Date.now();
    bossT++;
    phaseTimer++;

    drawBG();

    /* ── INTRO PHASE ── */
    if (phase==='intro') {
      const b=BOSSES[bossIdx];
      drawBoss(bossX,bossY,boss);
      // boss name slide in
      const prog=Math.min(1,phaseTimer/60);
      ctx.save();
      ctx.globalAlpha=prog;
      ctx.font=`bold ${mob?22:32}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='#f0d060';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=16;
      ctx.fillText(`BOSS ${bossIdx+1}: ${b.name}`,CX,H*0.55);
      ctx.shadowBlur=0;
      ctx.font=`italic ${mob?14:18}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='rgba(201,168,76,0.7)';
      ctx.fillText(b.reward,CX,H*0.55+(mob?32:44));
      ctx.restore();
      drawPlayer(pX,pY);
      if(phaseTimer>110) { phase='fight'; enemyShootRate=1400-bossIdx*200; }
      hudL.textContent=''; hudR.textContent='';
      return;
    }

    /* ── FIGHT PHASE ── */
    if (phase==='fight') {
      // Move boss side to side
      bossX += boss.spd * bossDir * (1+bossIdx*0.3);
      if(bossX > W-60) { bossX=W-60; bossDir=-1; }
      if(bossX < 60)   { bossX=60;   bossDir=1;  }

      // Enemy shoot
      if(now-lastEnemyBulletTime > enemyShootRate) {
        spawnBossBullet();
        lastEnemyBulletTime=now;
        if(boss.atk==='fast') enemyShootRate=Math.max(500,enemyShootRate-5);
      }

      // Player move
      const LEFT  = keys['ArrowLeft']  || keys['a'] || touchState.left;
      const RIGHT = keys['ArrowRight'] || keys['d'] || touchState.right;
      const JUMP  = keys['ArrowUp']    || keys['w'] || keys[' '] || touchState.jump;
      const SHOOT = keys['z'] || keys['x'] || keys['Enter'] || touchState.shoot;

      if(LEFT)  pVX = Math.max(pVX-(mob?1.8:2.2), mob?-5:-7);
      if(RIGHT) pVX = Math.min(pVX+(mob?1.8:2.2), mob?5:7);
      if(!LEFT&&!RIGHT) pVX*=0.78;
      pX = Math.max(PW/2, Math.min(W-PW/2, pX+pVX));

      if(JUMP && !pJumping) { pVY=mob?-13:-16; pJumping=true; }
      pVY += 0.7;
      pY += pVY;
      if(pY>=FLOOR) { pY=FLOOR; pVY=0; pJumping=false; }

      // Player shoot
      if(SHOOT && now-lastBulletTime>SHOOT_RATE) {
        bullets.push({x:pX,y:pY-PH,vy:-(mob?9:12)});
        lastBulletTime=now; score+=1;
      }

      if(invincible>0) invincible--;

      // Update bullets
      bullets = bullets.filter(b=>{
        b.y+=b.vy;
        if(b.y<0) return false;
        // hit boss?
        if(Math.abs(b.x-bossX)<(mob?36:50) && Math.abs(b.y-bossY)<(mob?36:50)){
          boss.hp--;
          spawnParticles(bossX,bossY,BOSSES[bossIdx].col,6);
          if(boss.hp<=0){ phase='bossdie'; phaseTimer=0; }
          return false;
        }
        return true;
      });

      // Update enemy bullets
      enemyBullets = enemyBullets.filter(eb=>{
        eb.x+=eb.vx; eb.y+=eb.vy;
        if(eb.x<0||eb.x>W||eb.y<0||eb.y>H) return false;
        // hit player?
        if(invincible===0 && Math.abs(eb.x-pX)<(mob?18:22) && Math.abs(eb.y-pY)<(mob?22:28)){
          pHP--; invincible=60;
          spawnParticles(pX,pY,'#ff4444',4);
          enemyBullets=enemyBullets.filter(x=>x!==eb);
          if(pHP<=0){ phase='lose'; phaseTimer=0; }
          return false;
        }
        return true;
      });

      // Update particles
      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.035; });
      particles=particles.filter(p=>p.life>0);

      // Draw
      // Enemy bullets
      enemyBullets.forEach(eb=>{
        ctx.save();
        ctx.shadowColor=BOSSES[bossIdx].col; ctx.shadowBlur=8;
        ctx.fillStyle=BOSSES[bossIdx].col;
        ctx.beginPath(); ctx.arc(eb.x,eb.y,eb.r,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
      // Player bullets
      bullets.forEach(b=>{
        ctx.save();
        ctx.shadowColor='#ffd700'; ctx.shadowBlur=10;
        ctx.fillStyle='#fffbe0';
        ctx.fillRect(b.x-3,b.y-8,6,12);
        ctx.restore();
      });
      // Particles
      particles.forEach(p=>{
        ctx.save();
        ctx.globalAlpha=p.life;
        ctx.fillStyle=p.col;
        ctx.fillRect(p.x-3,p.y-3,6,6);
        ctx.restore();
      });

      drawBoss(bossX,bossY,boss);
      drawPlayer(pX,pY);
      drawControls();

      // Boss HP bar
      const bw=Math.min(W*0.6,280);
      drawHPBar(CX-bw/2,mob?44:56,bw,boss.hp,boss.maxhp,BOSSES[bossIdx].col);
      ctx.font=`italic ${mob?11:14}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='rgba(201,168,76,0.8)';
      ctx.textAlign='center';
      ctx.fillText(BOSSES[bossIdx].name,CX,mob?38:50);

      // Player HP
      hudL.innerHTML = '❤️'.repeat(pHP);
      hudR.textContent = `✦ ${score}`;
    }

    /* ── BOSS DIE ── */
    if(phase==='bossdie'){
      phaseTimer++;
      spawnParticles(bossX+Math.random()*60-30,bossY+Math.random()*40-20,BOSSES[bossIdx].col,3);
      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.025; });
      particles=particles.filter(p=>p.life>0);
      particles.forEach(p=>{
        ctx.save(); ctx.globalAlpha=p.life;
        ctx.shadowColor=p.col; ctx.shadowBlur=8;
        ctx.fillStyle=p.col; ctx.fillRect(p.x-4,p.y-4,8,8);
        ctx.restore();
      });
      drawPlayer(pX,pY);
      // "DEFEATED!" text
      ctx.save();
      ctx.font=`bold ${mob?26:38}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='#ffd700'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
      ctx.fillText(BOSSES[bossIdx].reward+' DEFEATED!',CX,CY);
      ctx.restore();
      if(phaseTimer>100) nextBoss();
      hudL.innerHTML='❤️'.repeat(pHP); hudR.textContent=`✦ ${score}`;
    }

    /* ── WIN ── */
    if(phase==='win'){
      phaseTimer++;
      drawPlayer(pX,FLOOR);
      // Gold rain
      for(let i=0;i<3;i++) particles.push({
        x:Math.random()*W,y:0,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
        life:1,col:`hsl(${42+Math.random()*18},90%,${65+Math.random()*25}%)`
      });
      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life-=0.008; });
      particles=particles.filter(p=>p.life>0&&p.y<H);
      particles.forEach(p=>{
        ctx.save(); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.col;
        ctx.fillRect(p.x,p.y,4,4);
        ctx.restore();
      });
      const prog=Math.min(1,phaseTimer/50);
      ctx.save();
      ctx.globalAlpha=prog;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=24;
      ctx.font=`bold ${mob?28:42}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='#ffd700';
      ctx.fillText('🏆 YOU WIN, PIKA! 🏆',CX,H*0.35);
      ctx.shadowBlur=0;
      ctx.font=`italic ${mob?15:20}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='rgba(240,220,160,0.9)';
      ctx.fillText(`Score: ${score} ✦`,CX,H*0.45);
      ctx.font=`italic ${mob?13:17}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='rgba(201,168,76,0.7)';
      if(phaseTimer>60) ctx.fillText('tap to continue →',CX,H*0.58);
      ctx.restore();
      hudL.innerHTML='❤️'.repeat(pHP); hudR.textContent=`✦ ${score}`;
      if(phaseTimer>80) {
        wrap.addEventListener('click', finishGame, {once:true});
        wrap.addEventListener('touchend', finishGame, {once:true});
      }
    }

    /* ── LOSE ── */
    if(phase==='lose'){
      phaseTimer++;
      const prog=Math.min(1,phaseTimer/50);
      ctx.save(); ctx.globalAlpha=prog;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`bold ${mob?26:38}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='#ff6644'; ctx.shadowColor='#ff4400'; ctx.shadowBlur=20;
      ctx.fillText('💀 DEFEATED...',CX,H*0.38);
      ctx.shadowBlur=0;
      ctx.font=`italic ${mob?14:18}px 'Cormorant Garamond',serif`;
      ctx.fillStyle='rgba(201,168,76,0.7)';
      if(phaseTimer>60) ctx.fillText('tap to try again ↺',CX,H*0.52);
      ctx.restore();
      if(phaseTimer>80) {
        wrap.addEventListener('click', restartGame, {once:true});
        wrap.addEventListener('touchend', restartGame, {once:true});
      }
    }
  })();

  function finishGame() {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', handleResize);
    wrap.style.opacity='0';
    // show special win message
    showBossWinMessage(()=>{
      wrap.remove();
      onDone();
    });
  }

  function restartGame() {
    // reset state
    bossIdx=0; boss={...BOSSES[0]};
    bossX=CX; bossDir=1; bossT=0;
    pX=CX; pVX=0; pY=FLOOR; pVY=0; pJumping=false;
    pHP=5; invincible=0; score=0;
    bullets=[]; enemyBullets=[]; particles=[];
    phase='intro'; phaseTimer=0;
  }
}
